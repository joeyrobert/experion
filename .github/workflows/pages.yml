name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'nets/**', 'third_party/**', 'tools/build_wasm.sh', 'tools/build_fruit_wasm.sh', 'tools/wasm_smoke.mjs', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'src/**', 'nets/**', 'third_party/**', 'tools/build_wasm.sh', 'tools/build_fruit_wasm.sh', 'tools/wasm_smoke.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
      - name: Install wasi-sdk
        run: |
          curl -sSL -o wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          mkdir wasi-sdk && tar xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1
          echo "WASI_SDK=$PWD/wasi-sdk" >> "$GITHUB_ENV"
          echo "$PWD/wasi-sdk/bin" >> "$GITHUB_PATH"
      - name: Build Experion for the browser
        run: tools/build_wasm.sh
      - name: Build Fruit for the browser
        run: tools/build_fruit_wasm.sh
      - name: Smoke test
        run: node tools/wasm_smoke.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
