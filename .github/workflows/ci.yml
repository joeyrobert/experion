name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
      - name: Build
        run: shards build --release
      - name: Perft suite
        run: crystal spec
      - name: UCI smoke test
        run: |
          printf 'uci\nisready\nposition startpos\ngo depth 8\n' | (cat; sleep 3; echo quit) | ./bin/experion | tee out.txt
          grep -q '^bestmove' out.txt
          grep -q 'option name EvalFile' out.txt
